<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Drillot Studio</title>
    <link rel="stylesheet" href="/assets/styles.css">
</head>

<body class="bg-[#0e0e0e] text-white min-h-screen flex flex-col font-['Space_Grotesk'] m-0">

    <!-- NAVBAR -->
    <nav class="fixed w-full p-8 flex justify-between items-start z-20 bg-[#0e0e0e]/80 backdrop-blur-md">
        <div class="logo">
            <a href="/index.html" class="uppercase text-white">Drillot Studio</a>
        </div>
        <div class="nav-links flex gap-10 uppercase text-white">
            <a href="/index.html" class="text-white/60 hover:text-white transition-colors">Home</a>
            <a href="/gallery.html" class="text-white/60 hover:text-white transition-colors">Gallery</a>
            <a href="/admin.html" class="text-white underline underline-offset-4">Admin</a>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow pt-32 pb-16 px-4 md:px-8 w-full max-w-7xl mx-auto flex flex-col items-center">

        <!-- ─────────── 1. LOGIN VIEW ─────────── -->
        <section id="login-view" class="w-full max-w-md my-auto flex flex-col gap-6 items-center">
            <div class="w-full bg-[#161616] border border-white/10 rounded-2xl p-8 shadow-2xl">
                <div class="text-center mb-6">
                    <span class="text-xs uppercase tracking-[0.2em] text-red-500 font-semibold">
                        Acceso Restringido
                    </span>
                    <h2 class="text-2xl font-bold mt-4 tracking-tight">Administración</h2>
                    <p class="text-xs text-white/50 mt-1">Inicie sesión para acceder al panel de control.</p>
                </div>

                <form id="login-form" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-white/60 mb-1" for="login-username">Usuario</label>
                        <input type="text" id="login-username" required class="w-full bg-[#202020] border border-white/10 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-white/30 text-sm transition-all" placeholder="toto1234">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-white/60 mb-1" for="login-password">Contraseña</label>
                        <input type="password" id="login-password" required class="w-full bg-[#202020] border border-white/10 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-white/30 text-sm transition-all" placeholder="••••••••">
                    </div>
                    <button type="submit" class="w-full mt-2 bg-white text-black font-semibold hover:bg-white/90 transition-all rounded-lg py-2.5 text-sm cursor-pointer">
                        Ingresar
                    </button>
                    <div id="login-error" class="text-xs text-red-400 text-center font-medium min-h-[1.25rem] mt-1"></div>
                </form>
            </div>
        </section>

        <!-- ─────────── 2. ADMIN VIEW (Authorized) ─────────── -->
        <section id="admin-view" class="w-full hidden flex flex-col gap-8">
            <!-- Header bar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-6 border-b border-white/10">
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-3">
                        <span class="text-emerald-400 text-sm font-semibold tracking-wide">Bienvenido Admin</span>
                    </div>
                </div>
                <button id="logout-btn" class="border border-white/10 hover:bg-white/10 text-white/80 hover:text-white px-4 py-2 rounded-lg text-xs font-semibold uppercase tracking-wider transition-all cursor-pointer">
                    Cerrar Sesión
                </button>
            </div>

            <!-- Controles -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div class="flex bg-[#161616] p-1 rounded-lg border border-white/10">
                    <button id="tab-users" class="px-5 py-2 text-xs font-bold uppercase tracking-wider rounded-md bg-white text-black transition-all cursor-pointer">
                        Usuarios
                    </button>
                    <button id="tab-content" class="px-5 py-2 text-xs font-bold uppercase tracking-wider rounded-md text-white/60 hover:text-white transition-all cursor-pointer">
                        Contenido
                    </button>
                </div>
                <div>
                    <button id="add-btn" class="bg-white text-black hover:bg-white/90 font-bold text-xs uppercase tracking-wider px-5 py-2.5 rounded-lg flex items-center gap-2 transition-all cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                        </svg>
                        <span>Agregar Registro</span>
                    </button>
                </div>
            </div>


            <div class="bg-[#161616] border border-white/10 rounded-2xl overflow-hidden shadow-xl">
                <!-- User Table -->
                <div id="users-table-container" class="overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-white/10 bg-[#1e1e1e] text-[11px] uppercase tracking-wider text-white/50">
                                <th class="py-4 px-6 font-semibold">Nombre</th>
                                <th class="py-4 px-6 font-semibold">Email</th>
                                <th class="py-4 px-6 font-semibold text-center">Suscrito</th>
                                <th class="py-4 px-6 font-semibold text-center">Admin</th>
                                <th class="py-4 px-6 font-semibold">F. Registro</th>
                                <th class="py-4 px-6 font-semibold text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody" class="divide-y divide-white/5 text-sm text-white/80">

                        </tbody>
                    </table>
                </div>

                <div id="content-table-container" class="hidden overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-white/10 bg-[#1e1e1e] text-[11px] uppercase tracking-wider text-white/50">
                                <th class="py-4 px-6 font-semibold">ID</th>
                                <th class="py-4 px-6 font-semibold">Preview / Marca</th>
                                <th class="py-4 px-6 font-semibold">Ruta Multimedia</th>
                                <th class="py-4 px-6 font-semibold">Variedades</th>
                                <th class="py-4 px-6 font-semibold text-right">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="content-tbody" class="divide-y divide-white/5 text-sm text-white/80">

                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- ─────────── 3. MODALS (Create/Edit) ─────────── -->
    <div id="admin-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
        <div class="w-full max-w-lg bg-[#161616] border border-white/10 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
            <div class="px-6 py-4 border-b border-white/10 flex justify-between items-center bg-[#1e1e1e]">
                <h3 id="modal-title" class="font-bold text-lg">Editar Registro</h3>
                <button id="modal-close" class="text-white/60 hover:text-white text-lg font-bold cursor-pointer">&times;</button>
            </div>
            <form id="modal-form" class="p-6 flex flex-col gap-4 overflow-y-auto max-h-[70vh]">

                <div id="modal-fields" class="flex flex-col gap-4"></div>

                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-white/5">
                    <button type="button" id="modal-cancel-btn" class="px-4 py-2 border border-white/10 hover:bg-white/5 rounded-lg text-xs font-semibold uppercase tracking-wider transition-all cursor-pointer">
                        Cancelar
                    </button>
                    <button type="submit" class="px-5 py-2 bg-white text-black font-semibold hover:bg-white/90 rounded-lg text-xs uppercase tracking-wider transition-all cursor-pointer">
                        Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- MAIN SCRIPT -->
    <script type="module" src="/js/admin.js"></script>
</body>

</html>
