<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Drillot Studio</title>
  <script type="module" crossorigin src="/assets/gallery-B_cKmm8n.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/gsap-BJujGWlz.js">
  <link rel="stylesheet" crossorigin href="/assets/gsap-BV7ivE22.css">
</head>

<body class="!bg-white !text-[#3b3b3b] h-screen overflow-hidden m-0">

    <!-- ─────────── NAV ─────────── -->
    <nav class="fixed w-full p-8 flex justify-between items-start z-20 font-['Space_Grotesk']">
        <div class="logo w-8">
            <a href="/index.html" class="uppercase !text-[#3b3b3b]">Drillot Studio</a>
        </div>
        <div class="nav-links flex gap-3 uppercase">
            <a href="/index.html" class="!text-[#3b3b3b]">Home</a>
            <a href="/gallery.html" class="!text-[#3b3b3b] underline underline-offset-4">Projects</a>
            <a href="#" class="!text-[#3b3b3b]">About Us</a>
        </div>
    </nav>

    <!-- ─────────── GALERÍA INFINITA ARRASTRABLE ─────────── -->
    <div class="gallery">
        <section id="gallerydrag"
            class="gallerydrag relative w-full h-screen overflow-hidden touch-none select-none cursor-grab will-change-transform transition-transform duration-500 ease-[cubic-bezier(.18,.71,.11,1)]">

            <!-- Título centrado por encima del plano -->
            <div class="title-wrapper pointer-events-none absolute left-1/2 top-1/2 z-[5] text-center text-[#3b3b3b] will-change-transform">
                <h1 class="leading-[0.92] tracking-tight">
                    <span class="line block overflow-hidden">
                        <span class="line-inner block font-['Space_Grotesk'] font-light text-[clamp(2.2rem,7vw,5rem)]">Glow Up</span>
                    </span>
                    <span class="line block overflow-hidden">
                        <span class="line-inner block font-['Glitten'] text-[clamp(3.4rem,13vw,9.5rem)] leading-[0.8]">Gallery</span>
                    </span>
                </h1>
            </div>

            <!-- Plano NxN de tiles idénticos (lo rellena src/gallery.ts) -->
            <div class="gallery-container grid w-max [backface-visibility:hidden] will-change-transform pointer-events-none select-none"></div>
        </section>
    </div>

    <!-- Pista de interacción -->
    <div class="gallery-hint pointer-events-none fixed bottom-8 left-1/2 -translate-x-1/2 z-20 font-['Space_Grotesk'] text-[0.7rem] uppercase tracking-[0.2em] text-[#3b3b3b]/60">
        Drag &middot; Scroll to explore
    </div>

</body>

</html>
